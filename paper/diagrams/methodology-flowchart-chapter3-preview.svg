<text x="285.0" y="520.5" font-size="10" text-anchor="middle" fill="#2b3a4a">mismatch</text>
<path d="M 390.0,554.0 L 390.0,578.0" fill="none" stroke="#2b3a4a" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="364.0" y="557.0" width="52" height="16" fill="white" opacity="0.95"/>
<text x="390.0" y="569.5" font-size="10" text-anchor="middle" fill="#2b3a4a">match</text>
