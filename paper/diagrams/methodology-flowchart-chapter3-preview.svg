<svg xmlns="http://www.w3.org/2000/svg" width="850" height="1170" viewBox="0 0 850 1170" font-family="Helvetica, Arial, sans-serif">
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#2b3a4a"/></marker></defs>
<rect x="30" y="60" width="790" height="150" rx="8" fill="none" stroke="#8a8a8a" stroke-dasharray="8 8"/>
<text x="40" y="78" font-size="12" font-weight="600" fill="#555">Host memory system</text>
<rect x="30" y="225" width="790" height="650" rx="8" fill="none" stroke="#8a8a8a" stroke-dasharray="8 8"/>
<text x="40" y="243" font-size="12" font-weight="600" fill="#555">MemBud pre-commit safety layer (gate-only mode)</text>
<rect x="30" y="865" width="790" height="150" rx="8" fill="none" stroke="#8a8a8a" stroke-dasharray="8 8"/>
<text x="40" y="883" font-size="12" font-weight="600" fill="#555">Guarded store and append-only audit log</text>
<rect x="330" y="78" width="120" height="42" rx="21" fill="#f5f7fa" stroke="#2b3a4a" stroke-width="2"/>
<text x="390.0" y="103.0" font-size="12" text-anchor="middle" fill="#2b3a4a">Start</text>
<polygon points="292.0,138 530,138 488.0,190 250,190" fill="#f5f7fa" stroke="#2b3a4a" stroke-width="2"/>
<text x="390.0" y="160.5" font-size="12" text-anchor="middle" fill="#2b3a4a">Host proposes a memory update</text>
<text x="390.0" y="175.5" font-size="12" text-anchor="middle" fill="#2b3a4a">(prior state + evidence + operations)</text>
<rect x="270" y="250" width="240" height="52" rx="7" fill="#f5f7fa" stroke="#2b3a4a" stroke-width="2"/>
<text x="390.0" y="272.5" font-size="12" text-anchor="middle" fill="#2b3a4a">Adapter snapshot(scope)</text>
<text x="390.0" y="287.5" font-size="12" text-anchor="middle" fill="#2b3a4a">returns canonical prior records</text>
<rect x="270" y="318" width="240" height="52" rx="7" fill="#f5f7fa" stroke="#2b3a4a" stroke-width="2"/>
<text x="390.0" y="340.5" font-size="12" text-anchor="middle" fill="#2b3a4a">Parse and validate transition</text>
<text x="390.0" y="355.5" font-size="12" text-anchor="middle" fill="#2b3a4a">(schema version 2 invariants)</text>
<polygon points="390.0,386 470,423.0 390.0,460 310,423.0" fill="#f5f7fa" stroke="#2b3a4a" stroke-width="2"/>
<text x="390.0" y="419.5" font-size="12" text-anchor="middle" fill="#2b3a4a">Schema</text>
<text x="390.0" y="434.5" font-size="12" text-anchor="middle" fill="#2b3a4a">valid?</text>
<rect x="20" y="392" width="230" height="66" rx="7" fill="#fbeaea" stroke="#b23b3b" stroke-width="2"/>
<text x="135.0" y="414.0" font-size="12" text-anchor="middle" fill="#2b3a4a">INVALID_INPUT</text>
<text x="135.0" y="429.0" font-size="12" text-anchor="middle" fill="#2b3a4a">record for every arm</text>
<text x="135.0" y="444.0" font-size="12" text-anchor="middle" fill="#2b3a4a">no verification, no write</text>
<polygon points="390.0,480 470,517.0 390.0,554 310,517.0" fill="#f5f7fa" stroke="#2b3a4a" stroke-width="2"/>
<text x="390.0" y="513.5" font-size="12" text-anchor="middle" fill="#2b3a4a">Stored state</text>
<text x="390.0" y="528.5" font-size="12" text-anchor="middle" fill="#2b3a4a">= T.before?</text>
<rect x="30" y="486" width="230" height="66" rx="7" fill="#fbeaea" stroke="#b23b3b" stroke-width="2"/>
<text x="145.0" y="515.5" font-size="12" text-anchor="middle" fill="#2b3a4a">Fail closed; log audit error</text>
<text x="145.0" y="530.5" font-size="12" text-anchor="middle" fill="#2b3a4a">(no verification, no write)</text>
<rect x="20" y="585" width="200" height="44" rx="21" fill="#fbeaea" stroke="#b23b3b" stroke-width="2"/>
<text x="120.0" y="611.0" font-size="12" text-anchor="middle" fill="#2b3a4a">End (no write)</text>
<rect x="250" y="578" width="280" height="62" rx="7" fill="#f5f7fa" stroke="#2b3a4a" stroke-width="2"/>
<text x="390.0" y="605.5" font-size="12" text-anchor="middle" fill="#2b3a4a">Build canonical transition T = (B, C, E, R, O)</text>
<text x="390.0" y="620.5" font-size="12" text-anchor="middle" fill="#2b3a4a">and two renderings of the same facts: graph G, text Z</text>
<rect x="250" y="656" width="280" height="62" rx="7" fill="#f5f7fa" stroke="#2b3a4a" stroke-width="2"/>
<text x="390.0" y="683.5" font-size="12" text-anchor="middle" fill="#2b3a4a">Verifier arm (graph or text; rules or LLM)</text>
<text x="390.0" y="698.5" font-size="12" text-anchor="middle" fill="#2b3a4a">coverage, preservation, faithfulness (+ semantic)</text>
<polygon points="390.0,740 470,777.0 390.0,814 310,777.0" fill="#f5f7fa" stroke="#2b3a4a" stroke-width="2"/>
<text x="390.0" y="773.5" font-size="12" text-anchor="middle" fill="#2b3a4a">All required</text>
<text x="390.0" y="788.5" font-size="12" text-anchor="middle" fill="#2b3a4a">checks PASS?</text>
<rect x="100" y="900" width="260" height="76" rx="7" fill="#e8f2e8" stroke="#2e7d32" stroke-width="2"/>
<text x="230.0" y="927.0" font-size="12" text-anchor="middle" fill="#2b3a4a">ACCEPT</text>
<text x="230.0" y="942.0" font-size="12" text-anchor="middle" fill="#2b3a4a">append audit entry;</text>
<text x="230.0" y="957.0" font-size="12" text-anchor="middle" fill="#2b3a4a">atomic write (temp, fsync, rename), version + 1</text>
<rect x="500" y="900" width="260" height="76" rx="7" fill="#fbeaea" stroke="#b23b3b" stroke-width="2"/>
<text x="630.0" y="934.5" font-size="12" text-anchor="middle" fill="#2b3a4a">HOLD</text>
<text x="630.0" y="949.5" font-size="12" text-anchor="middle" fill="#2b3a4a">append audit entry; no write; store unchanged</text>
<rect x="330" y="1060" width="120" height="42" rx="21" fill="#f5f7fa" stroke="#2b3a4a" stroke-width="2"/>
<text x="390.0" y="1085.0" font-size="12" text-anchor="middle" fill="#2b3a4a">End</text>
<rect x="60" y="1110" width="730" height="32" rx="4" fill="#fffbe6" stroke="#b8a24a" stroke-dasharray="4 3"/>
<text x="425.0" y="1129.7" font-size="11" text-anchor="middle" fill="#2b3a4a">REVISE / retry is not implemented in this prototype; execution retries never authorise a commit.</text>
