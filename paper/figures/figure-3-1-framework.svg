<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,4 L0,8 z" fill="#333"/>
    </marker>
    <style>
      .box { fill: #f7f9fc; stroke: #2f4f6f; stroke-width: 1.6; rx: 8; ry: 8; }
      .alt { fill: #eef4ea; stroke: #3f6b3a; }
      .ctl { fill: #fbf3e6; stroke: #8a5a1a; }
      .title { font-size: 13px; font-weight: 600; fill: #1d2b3a; text-anchor: middle; }
      .sub { font-size: 12px; fill: #33475b; text-anchor: middle; }
      .edge { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .label { font-size: 11px; fill: #555; }
    </style>
  </defs>

  <!-- Row 1 -->
  <rect class="box" x="20" y="20" width="220" height="62"/>
  <text class="title" x="130" y="46">Host memory and</text>
  <text class="title" x="130" y="64">source evidence</text>

  <rect class="box" x="275" y="20" width="160" height="62"/>
  <text class="title" x="355" y="56">Proposed update</text>

  <rect class="box" x="470" y="20" width="160" height="62"/>
  <text class="title" x="550" y="56">Backend adapter</text>

  <rect class="box" x="665" y="20" width="250" height="62"/>
  <text class="title" x="790" y="42">Canonical transition package</text>
  <text class="sub" x="790" y="60">prior state, candidate, evidence,</text>
  <text class="sub" x="790" y="75">required claims, operations</text>

  <line class="edge" x1="240" y1="51" x2="273" y2="51"/>
  <line class="edge" x1="435" y1="51" x2="468" y2="51"/>
  <line class="edge" x1="630" y1="51" x2="663" y2="51"/>

  <!-- Row 2: representations -->
  <rect class="box" x="575" y="140" width="210" height="56"/>
  <text class="title" x="680" y="172">Graph representation</text>

  <rect class="box" x="825" y="140" width="200" height="56"/>
  <text class="title" x="925" y="172">Text representation</text>

  <line class="edge" x1="790" y1="82" x2="710" y2="138"/>
  <line class="edge" x1="790" y1="82" x2="900" y2="138"/>

  <!-- Row 3: verifiers -->
  <rect class="box ctl" x="560" y="250" width="240" height="52"/>
  <text class="title" x="680" y="281">Structural graph verifier</text>

  <rect class="box" x="825" y="250" width="200" height="52"/>
  <text class="title" x="925" y="281">Plain claim-set verifier</text>

  <rect class="box ctl" x="845" y="330" width="185" height="58"/>
  <text class="title" x="937" y="354">Fair text control</text>
  <text class="sub" x="937" y="372">(same contradiction access)</text>

  <line class="edge" x1="680" y1="196" x2="680" y2="248"/>
  <line class="edge" x1="925" y1="196" x2="925" y2="248"/>
  <line class="edge" x1="925" y1="302" x2="925" y2="328"/>

  <!-- Fair text branches from text (curved to the right side) -->
  <path class="edge" d="M1025,196 C1030,250 1010,300 985,328"/>

  <!-- Row 4: decision policy -->
  <rect class="box" x="365" y="415" width="330" height="62"/>
  <text class="title" x="530" y="442">Decision policy</text>
  <text class="sub" x="530" y="461">ACCEPT / HOLD / INVALID_INPUT</text>

  <line class="edge" x1="660" y1="302" x2="560" y2="413"/>
  <line class="edge" x1="900" y1="302" x2="600" y2="413"/>
  <line class="edge" x1="925" y1="388" x2="700" y2="413"/>

  <!-- Row 5: outcomes -->
  <rect class="box" x="110" y="488" width="250" height="62"/>
  <text class="title" x="235" y="513">Guarded commit</text>
  <text class="sub" x="235" y="532">to versioned store</text>

  <rect class="box" x="375" y="495" width="190" height="52"/>
  <text class="title" x="470" y="526">Append-only audit log</text>

  <rect class="box" x="600" y="495" width="250" height="52"/>
  <text class="title" x="725" y="526">Paired evaluation harness</text>

  <line class="edge" x1="470" y1="477" x2="255" y2="486"/>
  <line class="edge" x1="530" y1="477" x2="490" y2="493"/>
  <line class="edge" x1="600" y1="477" x2="690" y2="493"/>
</svg>
